<div class="article" appSwipeBrowse [swipeDisabled]="loading" (swipeLeft)="goNext()" (swipeRight)="goPrev()">
  <div class="article-toolbar">
    <app-back-link fallback="/events"></app-back-link>
  </div>
  <div class="page-loading" *ngIf="loading">
    <mat-spinner diameter="48"></mat-spinner>
  </div>
  <ng-container *ngIf="event">
    <div class="image-frame">
      <div class="image-box">
        <div class="clip-box">
          <img class="banner-image" src="{{event.imageURI}}" alt="{{event.header}}">
        </div>
      </div>
      <app-browse-pager
        [currentId]="eventId"
        [busy]="loading"
        (previous)="goPrev()"
        (next)="goNext()"
      ></app-browse-pager>
    </div>
    <div class="article-header-image-text">
      <h2>{{ event.header }}</h2>
      <div class="event-date-range">{{ dateRange }}</div>
      <div class="event-schedule" *ngIf="event.schedule">{{ event.schedule }}</div>
      <div class="event-where" *ngIf="event.where">{{ event.where }}</div>
      <div class="tag-list" *ngIf="event.tags?.length">
        <span class="tag-list-chip" *ngFor="let tag of event.tags">{{ tag }}</span>
      </div>
      <div class="event-status" [class.happening]="status === 'happening'" [class.ended]="status === 'ended'">
        {{ statusLabel }}
      </div>
      <div class="remind-me" *ngIf="status !== 'ended'">
        <button type="button"
          class="remind-button"
          [class.on]="reminderOn"
          [disabled]="!canRemind || reminderBusy"
          (click)="onRemindToggle()">
          {{ reminderBusy ? 'Saving...' : remindLabel }}
        </button>
        <p class="remind-hint">{{ remindHint }}</p>
        <p class="remind-hint error" *ngIf="reminderMessage">{{ reminderMessage }}</p>
      </div>
    </div>

    <span *ngIf="isLoggedIn">
      <a class="editLink" [routerLink]="[editLink]">Edit Event</a>
      |
      <button type="button" class="editLink deleteLink" (click)="onDelete()" [disabled]="deleting">
        {{ deleting ? 'Deleting...' : 'Delete Event' }}
      </button>
      <span class="delete-message" *ngIf="deleteMessage">{{ deleteMessage }}</span>
      <br/>
      <br/>
    </span>

    <div class="article-body" [innerHTML]="safeBodyHtml"></div>
  </ng-container>
  <div class="article-body-loading" *ngIf="!loading && notFound">
    <p>Event not found.</p>
  </div>
</div>
